model_name: 'sana_2B_480p_train'
is_i2v: True
report_to: "none"
tracker_name: sana_2B_480p_trainer
output_dir: outputs/sana_2B_480p_train   # 训练产出目录（ckpt/日志）

logging_dir: logs

train_data_class_path: data/agibotworld_dataset.py   # 数据集类路径，例如 data/agibotworld_dataset.py
train_data_class: AgiBotWorld              # 训练集类名
val_data_class_path: data/agibotworld_dataset.py  # 验证集类路径，若同训练集可复用
val_data_class: AgiBotWorld          # 验证集类名，若同训练集可复用

# 说明：
# - 当前仓库的 tokenizer/text_encoder/vae 加载逻辑依赖 diffusers 目录结构（tokenizer/、text_encoder/、vae/ 子目录）。
# - `/workspace/SANA-Video_2B_480p` 仅提供原仓库 `.pth` transformer 权重与 VAE pth，不包含 diffusers 的 tokenizer/text_encoder 目录。
# 因此这里继续复用 Cosmos2 的 diffusers 资源来加载 tokenizer/text_encoder/vae，
# 并在 `diffusion_model.model_path` 指向 SANA 的 `.pth` 作为 backbone 初始化。
pretrained_model_name_or_path: /workspace/Cosmos-Predict2-2B-Video2World
tokenizer_pretrained_model_name_or_path: /workspace/Cosmos-Predict2-2B-Video2World


### 
tokenizer_class_path: transformers
tokenizer_class: T5TokenizerFast
textenc_class_path: transformers
textenc_class: T5EncoderModel

vae_class_path: models/sana_models/autoencoder_kl_wan.py
vae_class: AutoencoderKLWan

diffusion_model_class_path: models/sana_models/transformer_sana_dit.py
diffusion_model_class: MultiViewSANATransformer3DModel

diffusion_scheduler_class_path: models/pipeline/gesim_cosmos2_pipeline_utils/scheduling_flow_match_euler_discrete.py
diffusion_scheduler_class: FlowMatchEulerDiscreteScheduler 

pipeline_class_path: models/pipeline/sana_pipeline.py
pipeline_class: CustomPipeline


# 
return_action: false
return_video: true
action_loss_scale: 1.0
action_cond_mode: true
train_mode: 'video_only'

mixed_precision: bf16
allow_tf32: False

caption_dropout_p: 0.06

# dataloader
batch_size: 4
dataloader_num_workers: 4

gradient_checkpointing: True
noise_to_first_frame: 0.1


max_grad_norm: 1.0
gradient_accumulation_steps: 1

# Optimizer Config
optimizer: adamw
lr: 3e-5                      # TODO: 根据显存/任务调节
beta1: 0.9
beta2: 0.95
beta3: 0.999
epsilon: 1e-8
weight_decay: 1e-5
optimizer_8bit: False
optimizer_torchao: False
scale_lr: False

# lr_scheduler Config
lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0

# Timestep Config
flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29

# 训练/日志/验证/保存步数
train_steps: 1000000 # 总步数
train_epochs: 10000 # 总epoch数
steps_to_save: 500 # 每多少步保存一次
steps_to_log: 20 # 每多少步记录一次日志
steps_to_val: 500 # 每多少步验证一次

# timeout, seconds
nccl_timeout: 600
seed: 42

# vae
enable_slicing: True
enable_tiling: True


# Timestep Config
flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29

pixel_wise_timestep: False


diffusion_model:
  # SANA backbone (original repo checkpoint)
  model_path: /workspace/SANA-Video_2B_480p/checkpoints/SANA_Video_2B_480p.pth

  config:
    # 与 `/workspace/SANA-Video_2B_480p/checkpoints/SANA_Video_2B_480p.pth` 的结构对齐：
    # hidden_dim=2240, num_layers=20, self-attn qkv 合并线性层
    latent_channels: 16
    cond_channels: 9   # traj(3) + ray(6)；训练时会在 token channel 维拼接
    out_channels: 16
    hidden_dim: 2240
    num_layers: 20
    num_heads: 20
    patch_size: [2, 2]          # 对应 checkpoint 的 x_embedder.proj.weight (..,1,2,2)
    timestep_embed_dim: 256
    text_embed_dim: 1024        # 复用 Cosmos 的 T5 d_model=1024，模型内部会投影到 2240


data:
  train:
    data_roots: ["/workspace/AgiBotWorld-Alpha"]
    task_info_root: "/workspace/AgiBotWorld-Alpha/task_info"
    domains: ["agibotworld", ]
    specific_tasks: [327, ] # 指定任务id
    dataset_info_cache_path: "/workspace/Genie-Envisioner/outputs/save/train/dataset_meta_info_cache"
    previous_pick_mode: 'random'
    sample_size: [384, 512]
    sample_n_frames: 360
    preprocess :  'resize'
    valid_cam :  ['head', 'hand_left', 'hand_right']
    # GE-Sim 条件训练需要 eef_quat（xyz+quat+gripper）来生成 traj map
    action_space: "eef_quat"
    action_type: "absolute"
    chunk: 25 ### 4n+1 for cosmos without padding frames
    action_chunk: 25
    n_previous: 4
  val:
    data_roots: ["/workspace/AgiBotWorld-Alpha"]
    task_info_root: "/workspace/AgiBotWorld-Alpha/task_info"
    domains: ["agibotworld", ]
    specific_tasks: [327, ] # 指定任务id
    dataset_info_cache_path: "/workspace/Genie-Envisioner/outputs/save/train/dataset_meta_info_cache"
    previous_pick_mode: 'random'
    sample_size: [384, 512]
    sample_n_frames: 360
    preprocess :  'resize'
    valid_cam :  ['head', 'hand_left', 'hand_right']
    action_space: "eef_quat"
    action_type: "absolute"
    chunk: 25
    action_chunk: 25
    n_previous: 4

use_color_jitter: true
num_inference_step: 15

load_weights: true

data_root: /workspace/AgiBotWorld-Alpha
task_id: 327
episode_id: 648642